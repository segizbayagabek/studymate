spring.application.name=studymate

spring.datasource.url=jdbc:postgresql://localhost:5432/studymate
spring.datasource.username=postgres
spring.datasource.password=Gololed777@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Email for login codes. GMAIL_USER and GMAIL_APP_PASSWORD are read from the .env file
# in the backend folder (or from environment variables), so they are never committed.
# GMAIL_APP_PASSWORD is a Gmail "App password", not your normal Gmail password.
spring.config.import=optional:file:.env[.properties]
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
