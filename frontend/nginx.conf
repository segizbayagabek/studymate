server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the Spring Boot container ("backend" is its name in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port (localhost:3000). Spring compares it with the browser's
        # Origin header; with $host the port is lost and Spring answers 403 "Invalid CORS request".
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: unknown paths like /profile load index.html and React picks the page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
