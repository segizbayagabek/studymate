r_id uuid</text><text x="82" y="190" font-family="DejaVu Sans" font-size="14">full_name varchar(120)</text><text x="82" y="217" font-family="DejaVu Sans" font-size="14">UQ email varchar(254)</text><text x="82" y="244" font-family="DejaVu Sans" font-size="14">password_hash text</text><text x="82" y="271" font-family="DejaVu Sans" font-size="14">created_at timestamptz</text><rect x="600" y="100" width="320" height="131" fill="#f8fafc" stroke="#262a54"/><rect x="600" y="100" width="320" height="39" fill="#262a54"/><text x="612" y="126" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">subjects</text><text x="612" y="163" font-family="DejaVu Sans" font-size="14">PK subject_id uuid</text><text x="612" y="190" font-family="DejaVu Sans" font-size="14">UQ course_code varchar(30)</text><text x="612" y="217" font-family="DejaVu Sans" font-size="14">name varchar(120)</text><rect x="1250" y="100" width="320" height="104" fill="#f8fafc" stroke="#262a54"/><rect x="1250" y="100" width="320" height="39" fill="#262a54"/><text x="1262" y="126" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">preference_options</text><text x="1262" y="163" font-family="DejaVu Sans" font-size="14">PK preference_id uuid</text><text x="1262" y="190" font-family="DejaVu Sans" font-size="14">UQ label varchar(80)</text><rect x="600" y="360" width="320" height="320" fill="#f8fafc" stroke="#262a54"/><rect x="600" y="360" width="320" height="39" fill="#262a54"/><text x="612" y="386" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">study_groups</text><text x="612" y="423" font-family="DejaVu Sans" font-size="14">PK group_id uuid</text><text x="612" y="450" font-family="DejaVu Sans" font-size="14">FK organizer_id uuid → users</text><text x="612" y="477" font-family="DejaVu Sans" font-size="14">FK subject_id uuid → subjects</text><text x="612" y="504" font-family="DejaVu Sans" font-size="14">title varchar(160)</text><text x="612" y="531" font-family="DejaVu Sans" font-size="14">description text</text><text x="612" y="558" font-family="DejaVu Sans" font-size="14">place varchar(200)</text><text x="612" y="585" font-family="DejaVu Sans" font-size="14">meeting_start timestamptz</text><text x="612" y="612" font-family="DejaVu Sans" font-size="14">meeting_end timestamptz</text><text x="612" y="639" font-family="DejaVu Sans" font-size="14">required_level varchar(20)</text><text x="612" y="666" font-family="DejaVu Sans" font-size="14">created_at timestamptz</text><rect x="1250" y="380" width="320" height="104" fill="#f8fafc" stroke="#262a54"/><rect x="1250" y="380" width="320" height="39" fill="#262a54"/><text x="1262" y="406" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">group_preferences</text><text x="1262" y="443" font-family="DejaVu Sans" font-size="14">PK/FK group_id → study_groups</text><text x="1262" y="470" font-family="DejaVu Sans" font-size="14">PK/FK preference_id → preference_options</text><rect x="600" y="820" width="320" height="320" fill="#f8fafc" stroke="#262a54"/><rect x="600" y="820" width="320" height="39" fill="#262a54"/><text x="612" y="846" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">join_requests</text><text x="612" y="883" font-family="DejaVu Sans" font-size="14">PK request_id uuid</text><text x="612" y="910" font-family="DejaVu Sans" font-size="14">FK group_id uuid → study_groups</text><text x="612" y="937" font-family="DejaVu Sans" font-size="14">FK applicant_id uuid → users</text><text x="612" y="964" font-family="DejaVu Sans" font-size="14">FK answer_subject_id → subjects</text><text x="612" y="991" font-family="DejaVu Sans" font-size="14">available_from timestamptz</text><text x="612" y="1018" font-family="DejaVu Sans" font-size="14">available_until timestamptz</text><text x="612" y="1045" font-family="DejaVu Sans" font-size="14">answer_level varchar(20)</text><text x="612" y="1072" font-family="DejaVu Sans" font-size="14">status Pending / Accepted / Rejected</text><text x="612" y="1099" font-family="DejaVu Sans" font-size="14">submitted_at timestamptz</text><text x="612" y="1126" font-family="DejaVu Sans" font-size="14">decided_at timestamptz nullable</text><rect x="1250" y="850" width="320" height="104" fill="#f8fafc" stroke="#262a54"/><rect x="1250" y="850" width="320" height="39" fill="#262a54"/><text x="1262" y="876" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">request_preferences</text><text x="1262" y="913" font-family="DejaVu Sans" font-size="14">PK/FK request_id → join_requests</text><text x="1262" y="940" font-family="DejaVu Sans" font-size="14">PK/FK preference_id → preference_options</text><text x="60" y="1315" font-family="DejaVu Sans" font-size="17">PK = primary key    FK = foreign key    UQ = unique key    0..* = zero or many</text><text x="60" y="1345" font-family="DejaVu Sans" font-size="16" fill="#5d6474">Membership derives from Accepted requests. Score derives from saved answers and locked group requirements.</text></svg>