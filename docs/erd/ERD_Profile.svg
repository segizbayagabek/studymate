<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1400" viewBox="0 0 1700 1400"><rect width="1700" height="1400" fill="white"/><text x="60" y="48" font-family="DejaVu Sans" font-size="29" font-weight="bold">StudyMate ERD — Optional profile</text><text x="60" y="78" font-family="DejaVu Sans" font-size="16" fill="#5d6474">Proposed design · Each child has one parent · A parent can have zero or many children</text><path d="M 390 196.25 H 440 V 215.5 H 520" fill="none" stroke="#68748A" stroke-width="2"/><text x="396" y="187.25" font-family="DejaVu Sans" font-size="15" fill="#262a54">1</text><text x="478" y="206.5" font-family="DejaVu Sans" font-size="15" fill="#262a54">0..*</text><text x="405" y="177.5" font-family="DejaVu Sans" font-size="14" fill="#5d6474">has level</text><path d="M 1010 215.5 H 925.0 V 215.5 H 840" fill="none" stroke="#68748A" stroke-width="2"/><text x="990" y="206.5" font-family="DejaVu Sans" font-size="15" fill="#262a54">1</text><text x="847" y="206.5" font-family="DejaVu Sans" font-size="15" fill="#262a54">0..*</text><text x="865" y="191.5" font-family="DejaVu Sans" font-size="14" fill="#5d6474">describes</text><path d="M 390 251.75 H 455 V 559.0 H 520" fill="none" stroke="#68748A" stroke-width="2"/><text x="396" y="242.75" font-family="DejaVu Sans" font-size="15" fill="#262a54">1</text><text x="478" y="550.0" font-family="DejaVu Sans" font-size="15" fill="#262a54">0..*</text><text x="405" y="521.0" font-family="DejaVu Sans" font-size="14" fill="#5d6474">has interval</text><path d="M 390 298.0 H 470 V 852.0 H 520" fill="none" stroke="#68748A" stroke-width="2"/><text x="396" y="289.0" font-family="DejaVu Sans" font-size="15" fill="#262a54">1</text><text x="478" y="843.0" font-family="DejaVu Sans" font-size="15" fill="#262a54">0..*</text><text x="405" y="814.0" font-family="DejaVu Sans" font-size="14" fill="#5d6474">prefers</text><path d="M 1010 662.0 H 925.0 V 852.0 H 840" fill="none" stroke="#68748A" stroke-width="2"/><text x="990" y="653.0" font-family="DejaVu Sans" font-size="15" fill="#262a54">1</text><text x="847" y="843.0" font-family="DejaVu Sans" font-size="15" fill="#262a54">0..*</text><text x="930.0" y="757.0" font-family="DejaVu Sans" font-size="14" fill="#5d6474">selected</text><rect x="70" y="150" width="320" height="185" fill="#f8fafc" stroke="#262a54"/><rect x="70" y="150" width="320" height="39" fill="#262a54"/><text x="82" y="176" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">users</text><text x="82" y="213" font-family="DejaVu Sans" font-size="14">PK user_id uuid</text><text x="82" y="240" font-family="DejaVu Sans" font-size="14">full_name varchar(120)</text><text x="82" y="267" font-family="DejaVu Sans" font-size="14">UQ email varchar(254)</text><text x="82" y="294" font-family="DejaVu Sans" font-size="14">password_hash text</text><text x="82" y="321" font-family="DejaVu Sans" font-size="14">created_at timestamptz</text><rect x="1010" y="150" width="320" height="131" fill="#f8fafc" stroke="#262a54"/><rect x="1010" y="150" width="320" height="39" fill="#262a54"/><text x="1022" y="176" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">subjects</text><text x="1022" y="213" font-family="DejaVu Sans" font-size="14">PK subject_id uuid</text><text x="1022" y="240" font-family="DejaVu Sans" font-size="14">UQ course_code varchar(30)</text><text x="1022" y="267" font-family="DejaVu Sans" font-size="14">name varchar(120)</text><rect x="1010" y="610" width="320" height="104" fill="#f8fafc" stroke="#262a54"/><rect x="1010" y="610" width="320" height="39" fill="#262a54"/><text x="1022" y="636" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">preference_options</text><text x="1022" y="673" font-family="DejaVu Sans" font-size="14">PK preference_id uuid</text><text x="1022" y="700" font-family="DejaVu Sans" font-size="14">UQ label varchar(80)</text><rect x="520" y="150" width="320" height="131" fill="#f8fafc" stroke="#262a54"/><rect x="520" y="150" width="320" height="39" fill="#262a54"/><text x="532" y="176" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">user_subject_levels</text><text x="532" y="213" font-family="DejaVu Sans" font-size="14">PK/FK user_id → users</text><text x="532" y="240" font-family="DejaVu Sans" font-size="14">PK/FK subject_id → subjects</text><text x="532" y="267" font-family="DejaVu Sans" font-size="14">knowledge_level varchar(20)</text><rect x="520" y="480" width="320" height="158" fill="#f8fafc" stroke="#262a54"/><rect x="520" y="480" width="320" height="39" fill="#262a54"/><text x="532" y="506" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">user_availability</text><text x="532" y="543" font-family="DejaVu Sans" font-size="14">PK availability_id uuid</text><text x="532" y="570" font-family="DejaVu Sans" font-size="14">FK user_id uuid → users</text><text x="532" y="597" font-family="DejaVu Sans" font-size="14">available_from timestamptz</text><text x="532" y="624" font-family="DejaVu Sans" font-size="14">available_until timestamptz</text><rect x="520" y="800" width="320" height="104" fill="#f8fafc" stroke="#262a54"/><rect x="520" y="800" width="320" height="39" fill="#262a54"/><text x="532" y="826" font-family="DejaVu Sans" font-size="18" fill="white" font-weight="bold">user_preferences</text><text x="532" y="863" font-family="DejaVu Sans" font-size="14">PK/FK user_id → users</text><text x="532" y="890" font-family="DejaVu Sans" font-size="14">PK/FK preference_id → preference_options</text><text x="60" y="1315" font-family="DejaVu Sans" font-size="17">PK = primary key    FK = foreign key    UQ = unique key    0..* = zero or many</text><text x="60" y="1345" font-family="DejaVu Sans" font-size="16" fill="#5d6474">Membership derives from Accepted requests. Score derives from saved answers and locked group requirements.</text></svg>